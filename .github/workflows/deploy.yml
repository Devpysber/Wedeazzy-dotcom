# Deploy to the Hostinger VPS on every push to main.
#
# Required repository secrets:
#   VPS_SSH_KEY   - private half of a deploy keypair whose public half is in
#                   ~/.ssh/authorized_keys of VPS_USER on the VPS
#   VPS_HOST      - the VPS IP (148.230.66.88)
#
# Optional repository secrets (sensible defaults when unset):
#   VPS_SSH_PORT  - SSH port, defaults to 22. Set this if sshd was moved off 22.
#   VPS_USER      - SSH user, defaults to root.
#   HEALTH_URL    - public health URL, defaults to https://wedeazzy.com/health
#
# Production secrets are NOT shipped by this workflow. They live only in
# /opt/wedeazzy-com/backend.env on the server and are never in the repo.
#
# If "Check the VPS is reachable" fails, the problem is the server or its
# firewall, not this repo. On the VPS run:
#   systemctl status ssh
#   ss -tlnp | grep sshd     # confirm the port sshd actually listens on
#   ufw status verbose       # port must be ALLOWed from anywhere (0.0.0.0/0)
# GitHub-hosted runners use a large, rotating IP range, so an allowlist of a
# handful of addresses will block them. Also check the Hostinger hPanel
# firewall, which sits in front of ufw and drops packets silently - which is
# exactly why the old workflow hung for two minutes instead of erroring.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deploys rebuild the same container at once.
  group: vps-deploy
  cancel-in-progress: false

jobs:
  # Cheap checks that run before anything touches the server. Both of these
  # exist because main once carried a server.js with unresolved merge conflict
  # markers in it: node could not parse the file, the container crash-looped,
  # and the only symptom anywhere was a 502 from Nginx. Catch that here, in
  # seconds, instead of on the VPS.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Reject unresolved merge conflict markers
        run: |
          if git grep -In -e '^<<<<<<< ' -e '^>>>>>>> ' -e '^=======$' -- . ; then
            echo "::error::Merge conflict markers are committed - see the lines above."
            exit 1
          fi
          echo "No conflict markers."

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Parse every backend source file
        run: |
          failed=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; failed=1; }
          done < <(find backend/src -name '*.js' -not -path '*/node_modules/*')
          [ "$failed" -eq 0 ]

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # `secrets.X || 'default'` resolves to the default when the secret is unset.
      SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.VPS_USER || 'root' }}
      HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://wedeazzy.com/health' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check the required secrets are set
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          if [ -z "${VPS_HOST}" ]; then
            echo "::error::Repository secret VPS_HOST is empty or not set."
            missing=1
          fi
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "::error::Repository secret VPS_SSH_KEY is empty or not set."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Deploy target: ${SSH_USER}@<VPS_HOST>:${SSH_PORT}"

      - name: Check the VPS is reachable
        # Done before anything else so an unreachable box fails with a readable
        # message, instead of surfacing as an opaque ssh-keyscan exit 1 followed
        # by a two-minute ssh timeout in the diagnostics step.
        #
        # Retried, not one-shot. A single 15s probe failed a re-run of a commit
        # that had deployed successfully minutes earlier, from the same
        # workflow against the same server: reachability from GitHub's runner
        # pool is intermittent, whether that is fail2ban banning a runner IP,
        # the hPanel firewall, or ordinary packet loss. One dropped probe is
        # not evidence the server is down, so give it ~2 minutes before saying
        # so. A genuinely unreachable host still fails, with the same guidance.
        timeout-minutes: 4
        run: |
          for attempt in $(seq 1 8); do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${SSH_PORT}" 2>/dev/null; then
              echo "TCP ${SSH_PORT} is open (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt}/8: no TCP connection on port ${SSH_PORT}."
            # Explicit if, not `[ ] && sleep`: under `set -e` a failing test as
            # the loop body's last command is a well-known way to end a job
            # early with no error message at all.
            if [ "$attempt" -lt 8 ]; then sleep 15; fi
          done
          echo "::error::Cannot open a TCP connection to the VPS on port ${SSH_PORT} after 8 attempts over ~2 minutes."
          echo "The deploy never got as far as authenticating - the packets are being"
          echo "dropped or the host is down. This is a server/firewall problem, not a"
          echo "problem with the code in this repository. Check, on the VPS:"
          echo "  systemctl status ssh"
          echo "  ss -tlnp | grep sshd"
          echo "  ufw status verbose"
          echo "and check the Hostinger hPanel firewall, which sits in front of ufw."
          echo "If sshd listens on a non-standard port, set the VPS_SSH_PORT secret."
          echo "--- extra detail (best effort) ---"
          getent hosts "${VPS_HOST}" || echo "(no DNS record - VPS_HOST is presumably a raw IP)"
          timeout 20 nc -vz "${VPS_HOST}" "${SSH_PORT}" || true
          exit 1

      - name: Load the deploy key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf, not echo: keeps the trailing newline OpenSSH requires even when
          # the secret was pasted without one.
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid, passphrase-less private key."
            echo "Store the PRIVATE half - the whole file including the BEGIN/END"
            echo "lines - of a key made with: ssh-keygen -t ed25519 -N ''"
            exit 1
          fi
          # -T bounds the scan. A failure here is not fatal: the ssh config below
          # falls back to accept-new.
          ssh-keyscan -T 15 -p "${SSH_PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts \
            || echo "::warning::ssh-keyscan found no host key; falling back to accept-new."
          {
            echo "Host vps"
            echo "  HostName ${VPS_HOST}"
            echo "  User ${SSH_USER}"
            echo "  Port ${SSH_PORT}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
            echo "  ServerAliveCountMax 8"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Check the deploy key is authorised
        # Separates "the firewall blocked us" from "the key is wrong", which the
        # old workflow reported identically as a bare timeout.
        timeout-minutes: 3
        run: |
          # Same reasoning as the reachability retry above: the handshake is the
          # next thing an intermittent block takes out, and a rejected key is
          # not something that fixes itself, so retrying costs nothing when the
          # key really is wrong.
          for attempt in 1 2 3; do
            if ssh vps 'echo "authenticated as $(whoami) on $(hostname)"'; then
              exit 0
            fi
            echo "Attempt ${attempt}/3 failed."
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "::error::TCP connected but SSH authentication failed."
          echo "The public half of VPS_SSH_KEY must be in ~${SSH_USER}/.ssh/authorized_keys"
          echo "on the VPS, and sshd must permit that user (PermitRootLogin"
          echo "prohibit-password when deploying as root). Handshake tail follows:"
          ssh -vv vps true 2>&1 | tail -40 || true
          exit 1

      - name: Pull and rebuild
        timeout-minutes: 15
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/wedeazzy-com
          git fetch --prune origin
          git reset --hard origin/main
          docker compose -f docker-compose.prod.yml up -d --build app
          REMOTE

      - name: Verify the app is healthy on the VPS
        # Checked on the box first, over the loopback port the container
        # publishes. If this passes but the public check fails, the app is fine
        # and the fault is Nginx/TLS/DNS - a distinction worth having.
        timeout-minutes: 9
        run: |
          ssh vps 'bash -s' <<'REMOTE'
          set -uo pipefail
          cd /opt/wedeazzy-com
          # 90 x 5s: migrations run in the background after the port opens, and
          # /health reports 503 with `"migrations":"pending"` until they finish.
          for i in $(seq 1 90); do
            body=$(curl -sS --max-time 10 http://127.0.0.1:4000/health 2>/dev/null || true)
            echo "Attempt $i: ${body:-<no response - port closed, app is not running>}"
            case "$body" in
              *'"ok":true'*)
                echo "App is healthy on the VPS loopback."
                exit 0
                ;;
            esac
            sleep 5
          done
          echo "App never became healthy on 127.0.0.1:4000/health."
          # Dump the evidence here rather than leaving it to the diagnostics
          # step: a container that crash-loops answers nothing at all, and
          # `<no response>` ninety times says nothing about why. The restart
          # count is the tell - a syntax error in server.js shows up as a
          # container that has restarted dozens of times in a couple of minutes.
          echo "=== Container status ==="
          docker compose -f docker-compose.prod.yml ps
          echo "=== Restart counts ==="
          docker inspect --format '{{.Name}} restarts={{.RestartCount}} state={{.State.Status}} exit={{.State.ExitCode}}' \
            $(docker compose -f docker-compose.prod.yml ps -q) 2>/dev/null || true
          echo "=== App logs (tail 150) ==="
          docker compose -f docker-compose.prod.yml logs --tail=150 --no-color app
          exit 1
          REMOTE

      - name: Verify the public endpoint is healthy
        timeout-minutes: 5
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -k -o /tmp/health_response.txt \
                          -w '%{http_code}' --max-time 15 "${HEALTH_URL}" || echo 000)
            body=$(cat /tmp/health_response.txt 2>/dev/null || true)
            echo "Attempt $i: HTTP ${status} | ${body:-<no body>}"
            if [ "$status" = "200" ] && printf '%s' "$body" | grep -q '"ok":true'; then
              echo "Public endpoint is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::${HEALTH_URL} never returned a healthy response."
          exit 1

      - name: Diagnostics on failure
        if: failure()
        # continue-on-error so a diagnostics hiccup cannot overwrite the real
        # failure with a misleading one, and so an unreachable host stops adding
        # two minutes of dead timeout to every red run.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if ! ssh -o ConnectTimeout=15 vps true 2>/dev/null; then
            echo "VPS is not reachable over SSH, so there are no container diagnostics."
            echo "See the 'Check the VPS is reachable' step above for what to do."
            exit 0
          fi
          ssh vps 'bash -s' <<'REMOTE'
          cd /opt/wedeazzy-com || exit 0
          echo "=== Container Status ==="
          docker compose -f docker-compose.prod.yml ps
          echo "=== Recent App Logs ==="
          docker compose -f docker-compose.prod.yml logs --tail=100 app
          echo "=== Recent DB Logs ==="
          docker compose -f docker-compose.prod.yml logs --tail=30 db
          echo "=== Nginx ==="
          systemctl is-active nginx || true
          REMOTE

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
