<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Password — WedEazzy Vendor Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/css/enhance.css" />
  <style>
    body {
      background-color: var(--bg-body, #FBF7F2);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    .auth-container {
      max-width: 460px;
      margin: 60px auto;
      padding: 0 20px;
      width: 100%;
      box-sizing: border-box;
    }
    .auth-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      font-size: 26px;
      font-weight: 800;
      color: #DC1F30;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      color: #6B7280;
      font-size: 14px;
      margin-top: 6px;
    }
    .notice-box {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      color: #1E40AF;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #D1D5DB;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: #DC1F30;
      box-shadow: 0 0 0 3px rgba(220, 31, 48, 0.12);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #DC1F30;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #B91C1C;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert-error {
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <a href="/" class="brand-logo">WedEazzy</a>
        <div class="brand-subtitle">Vendor Portal Security</div>
      </div>

      <h2 style="margin: 0 0 8px 0; font-size: 20px; color: #111827; text-align: center;">Create Your New Password</h2>
      <p style="color: #6B7280; font-size: 13px; text-align: center; margin-top: 0; margin-bottom: 20px;">
        For security, you must set a new password before accessing your Vendor Dashboard.
      </p>

      <div class="notice-box">
        <i class="fa-solid fa-shield-halved" style="margin-top: 2px;"></i>
        <div>Please enter your temporary password sent to your email, followed by your new password.</div>
      </div>

      <div id="errorMessage" class="alert-error"></div>

      <form id="changePasswordForm">
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="currentPassword" style="margin:0;">Temporary / Current Password *</label>
            <button type="button" onclick="togglePasswordVisibility('currentPassword', this)" style="font-size: 12.5px; color: #DC1F30; font-weight: 600; background: none; border: none; cursor: pointer; font-family: inherit;">Show</button>
          </div>
          <input type="password" id="currentPassword" class="form-input" placeholder="Enter temporary password" required />
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="newPassword" style="margin:0;">New Password *</label>
            <button type="button" onclick="togglePasswordVisibility('newPassword', this)" style="font-size: 12.5px; color: #DC1F30; font-weight: 600; background: none; border: none; cursor: pointer; font-family: inherit;">Show</button>
          </div>
          <input type="password" id="newPassword" class="form-input" placeholder="At least 8 characters (mixed case, number, symbol)" minlength="8" required />
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" for="confirmPassword" style="margin:0;">Confirm New Password *</label>
            <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)" style="font-size: 12.5px; color: #DC1F30; font-weight: 600; background: none; border: none; cursor: pointer; font-family: inherit;">Show</button>
          </div>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter new password" minlength="8" required />
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Update Password & Continue</button>
      </form>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        if (btn) btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        if (btn) btn.textContent = 'Show';
      }
    }
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("changePasswordForm");
      const errBox = document.getElementById("errorMessage");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.style.display = "none";

        const currentPassword = document.getElementById("currentPassword").value.trim();
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        if (newPassword.length < 8) {
          errBox.textContent = "New password must be at least 8 characters long.";
          errBox.style.display = "block";
          return;
        }

        if (newPassword !== confirmPassword) {
          errBox.textContent = "New password and confirmation do not match.";
          errBox.style.display = "block";
          return;
        }

        const token = localStorage.getItem("wedeazzy_vendor_token") ||
                      sessionStorage.getItem("wedeazzy_vendor_token") ||
                      localStorage.getItem("wedeazzy_token") ||
                      sessionStorage.getItem("wedeazzy_token");

        if (!token) {
          errBox.textContent = "Session token missing. Please log in with your temporary credentials.";
          errBox.style.display = "block";
          setTimeout(() => { window.location.href = "/pages/admin-login.html"; }, 2000);
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Updating Password...";

        try {
          const res = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({ currentPassword, newPassword })
          });

          const data = await res.json();
          if (!res.ok || !data.ok) {
            throw new Error(data.message || data.error || "Failed to update password");
          }

          submitBtn.textContent = "Password Updated! Redirecting...";
          setTimeout(() => {
            window.location.href = "/pages/bdashboard.html";
          }, 1000);
        } catch (err) {
          errBox.textContent = err.message;
          errBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password & Continue";
        }
      });
    });
  </script>
</body>
</html>
